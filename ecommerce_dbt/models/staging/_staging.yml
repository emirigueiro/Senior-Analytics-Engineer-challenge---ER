version: 2

# Severidad: se configura en cada TEST (dentro de su bloque config),
# no a nivel de columna. Sin config, el test es severity: error.

models:
  - name: stg_customers
    description: Clientes. Un registro por cliente.
    columns:
      - name: customer_id
        description: Clave del cliente.
        data_tests:
          - unique
          - not_null
      - name: email
        description: Email normalizado a minúsculas.
      - name: registered_at
        description: Fecha de registro del cliente.
      - name: country
        description: País del cliente.

  - name: stg_orders
    description: >
      Cabecera de órdenes. Un registro por orden. La moneda y el total vienen
      del sistema de origen sin validar; ver tests de severidad warn.
    columns:
      - name: order_id
        description: >
          Clave de la orden. El test de relationships hacia stg_order_items
          detecta órdenes sin líneas de ítems (warning: problema conocido).
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_order_items')
                field: order_id
      - name: customer_id
        description: Cliente que realizó la orden.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: ordered_at
        description: Timestamp de la orden (zona horaria no documentada en origen).
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: order_date
        description: Fecha de la orden (sin hora).
      - name: order_total_amount
        description: Total informado en la cabecera, en la moneda de la orden.
        data_tests:
          - not_null:
              config:
                severity: warn
          - positive_value:
              config:
                severity: warn
      - name: currency_code
        description: >
          Moneda de la orden. Se espera que exista en la API de tipo de cambio;
          los códigos inválidos (XYZ, ABC, QWE) se reportan como warning.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fx_rates')
                field: currency_from
              config:
                severity: warn
      - name: order_status
        description: >
          Estado de la orden. Hoy todas son 'completed'. Un valor nuevo se
          reporta como warning; el revenue elegible se filtra en el modelo.
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed']
              config:
                severity: warn

  - name: stg_order_items
    description: Líneas de orden. Un registro por línea.
    columns:
      - name: order_item_id
        description: Clave de la línea.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Orden a la que pertenece la línea.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        description: >
          Producto vendido. NO es una FK garantizada en origen: algunas líneas
          referencian productos que no están en el catálogo (warning).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
              config:
                severity: warn
      - name: quantity
        description: Unidades vendidas.
        data_tests:
          - not_null
          - positive_value
      - name: unit_price
        description: Precio unitario en la moneda de la línea.
        data_tests:
          - not_null
          - positive_value
      - name: currency_code
        description: >
          Moneda de la línea. Puede diferir de la moneda de su orden; los
          códigos inválidos se reportan como warning.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fx_rates')
                field: currency_from
              config:
                severity: warn

  - name: stg_products
    description: Catálogo de productos. Un registro por producto.
    columns:
      - name: product_id
        description: Clave del producto.
        data_tests:
          - unique
          - not_null
      - name: product_name
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: base_price
        description: Precio de lista del catálogo.
        data_tests:
          - positive_value:
              config:
                severity: warn
      - name: base_price_currency_code
        description: Moneda del precio de lista.
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: stg_fx_rates
    description: >
      Tasas de cambio aplanadas desde las respuestas de la API. Un registro
      por fecha + moneda origen + moneda destino.
    columns:
      - name: fx_rate_id
        description: Clave compuesta currency_from_currency_to_fecha.
        data_tests:
          - unique
          - not_null
      - name: currency_from
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: currency_to
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: rate_date
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: rate
        description: Unidades de currency_to por 1 unidad de currency_from.
        data_tests:
          - not_null:
              config:
                severity: warn
          - positive_value:
              config:
                severity: warn